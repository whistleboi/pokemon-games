<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pokémath Encyclopedia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/*CSS*/
/* Layout: a wiki - a sticky top bar (home, lists, search), then one page at a time in the walkthrough's wiki style */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--head); color: var(--head-fg); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--head); }
.bar .in { max-width: 980px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar a { color: var(--head-fg); text-decoration: none; font: 600 14px var(--display); letter-spacing: .04em; }
.bar a.home { font: 700 17px var(--display); letter-spacing: .02em; margin-right: 6px; }
.bar a:hover, .bar a:focus-visible { text-decoration: underline; }
.bar nav { display: flex; flex-wrap: wrap; gap: 4px 14px; }
.search { position: relative; margin-left: auto; flex: 1 1 200px; max-width: 320px; min-width: 0; }
.search input { width: 100%; box-sizing: border-box; font: 15px var(--body); padding: 6px 10px; border-radius: 6px; border: 1px solid var(--line);
  background: var(--panel); color: var(--fg); }
.hits { position: absolute; right: 0; left: 0; top: calc(100% + 4px); background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  box-shadow: 0 8px 24px rgba(0,0,0,.18); max-height: 60vh; overflow-y: auto; z-index: 6; }
.hits a { display: flex; align-items: center; gap: 8px; padding: 6px 10px; color: var(--fg); text-decoration: none; font: 15px var(--body); }
.hits a:hover, .hits a:focus-visible, .hits a.on { background: var(--row); }
.hits .kind { margin-left: auto; font: 600 11px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.types { display: flex; gap: 6px; flex-wrap: wrap; margin: 4px 0 10px; }
.type { font: 700 12px var(--display); letter-spacing: .06em; text-transform: uppercase; padding: 2px 10px; border-radius: 99px; background: var(--chip); }
.hero { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; margin: 6px 0 8px; }
.hero .ic.big { width: 96px; height: 96px; }
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px 18px; margin: 6px 0 14px; max-width: 640px; }
.facts div { font-size: 15px; } .facts b { display: block; font: 600 12px var(--display); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.stats { max-width: 520px; display: grid; grid-template-columns: 7.5em 2.5em 1fr; gap: 4px 10px; align-items: center; font-variant-numeric: tabular-nums; }
.stats .bar2 { height: 10px; border-radius: 5px; background: var(--accent); opacity: .8; }
.evo { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; margin: 8px 0 16px; }
.evo .step { display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 4px 10px; }
.evo .step.me { border-color: var(--accent); }
.evo .arrow { font-size: 13px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 14px; }
.chips a { background: var(--chip); color: var(--fg); padding: 4px 12px; border-radius: 99px; text-decoration: none; font: 600 14px var(--display); }
.chips a:hover, .chips a:focus-visible { background: var(--line); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin: 12px 0 20px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
.card h3 { margin: 0 0 4px; } .card p { margin: 0 0 8px; font-size: 15px; color: var(--muted); }
.card.later { opacity: .7; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 4px 16px; padding: 0; list-style: none; }
.grid3 li a { display: flex; align-items: center; gap: 8px; padding: 3px 0; text-decoration: none; color: var(--fg); }
.grid3 li a:hover { color: var(--accent); }
.grid3 .no { color: var(--muted); font-size: 13px; width: 2.6em; font-variant-numeric: tabular-nums; }
.pager { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 28px; }
.loading { color: var(--muted); padding: 40px 0; }
.ic.mid { width: 40px; height: 40px; }
details.walk summary { cursor: pointer; list-style: none; } details.walk summary::-webkit-details-marker { display: none; }
details.walk summary h2 { display: inline-block; } details.walk summary::after { content: " ▾"; color: var(--muted); }
.navbox { margin: 28px 0 10px; border: 3px solid var(--head); border-radius: 12px; background: var(--head); overflow: hidden; }
.navbox summary { cursor: pointer; list-style: none; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 12px; color: var(--head-fg); }
.navbox summary::-webkit-details-marker { display: none; }
.navbox summary::before { content: "▸"; position: absolute; left: 14px; font-size: 14px; }
.navbox[open] summary::before { content: "▾"; }
.navbox summary { position: relative; }
.nb-title { font: 700 1.15rem var(--display); }
.nb-badges { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; background: var(--panel); border-radius: 8px; padding: 4px 6px; }
.nb-badges .ic { width: 30px; height: 30px; }
.nb-body { background: var(--panel); margin: 0 6px 6px; border-radius: 9px; padding: 8px 12px 12px; text-align: center; }
.nb-h { font: 700 14px var(--display); letter-spacing: .03em; margin-top: 8px; }
.nb-row { font-size: 15px; line-height: 1.8; }
.nb-row a { white-space: nowrap; color: var(--accent); text-decoration: none; }
.nb-row a:hover, .nb-row a:focus-visible { text-decoration: underline; }
.placegrid { display: grid; grid-template-columns: minmax(0, 1fr) 290px; gap: 28px; align-items: start; }
.placegrid .infobox { grid-column: 2; grid-row: 1; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); }
.placegrid .placemain { grid-column: 1; grid-row: 1; min-width: 0; }
.placemain > h2:first-child { margin-top: 8px; }
@media (max-width: 820px) { .placegrid { grid-template-columns: minmax(0, 1fr); } .placegrid .infobox, .placegrid .placemain { grid-column: 1; grid-row: auto; position: static; } }
.infobox { background: var(--head); border-radius: 12px; padding: 10px; display: grid; gap: 8px; color: var(--head-fg); }
.ib-name { font: 700 1.25rem var(--display); text-align: center; }
.ib-h { font: 700 13px var(--display); letter-spacing: .06em; text-transform: uppercase; text-align: center; margin-top: 2px; }
.ib-row, .c-other { background: var(--panel); color: var(--fg); border-radius: 8px; padding: 8px 12px; text-align: center; font-size: 15px; }
.mapthumb { display: block; background: var(--panel); border-radius: 8px; padding: 6px; }
.mapthumb img { display: block; width: 100%; height: auto; max-height: 300px; object-fit: contain; image-rendering: pixelated; }
.compass { background: var(--panel); color: var(--fg); border-radius: 8px; padding: 8px; display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.2fr) minmax(0, 1fr); grid-template-areas: ". n ." "w h e" ". s ."; gap: 6px; align-items: center; text-align: center; font-size: 14px; }
.compass .c-N { grid-area: n; } .compass .c-S { grid-area: s; } .compass .c-W { grid-area: w; } .compass .c-E { grid-area: e; }
.compass > div { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; overflow-wrap: anywhere; }
.compass .c-W, .compass .c-E { flex-direction: row; flex-wrap: wrap; justify-content: center; }
.compass .c-here { grid-area: h; font: 700 15px var(--display); border-block: 2px solid var(--head); padding: 6px 4px; }
.compass .arr { color: var(--muted); font-size: 16px; line-height: 1; }
.compass a, .c-other a { color: var(--fg); }
.mapfull { overflow-x: auto; border: 2px solid var(--head); border-radius: 10px; background: var(--panel); margin: 6px 0 14px; }
.mapfull img { display: block; max-width: 100%; height: auto; image-rendering: pixelated; }
.mechlist { padding-left: 1.2em; } .mechlist li { margin: .3em 0; }
ol.chapters li, ul.sides li { margin: .6em 0; } details.howto summary { cursor: pointer; font-size: .9em; } details.howto { margin-top: .3em; }
.regionmap { position: relative; max-width: 960px; } .regionmap img { width: 100%; height: auto; image-rendering: pixelated; display: block; border-radius: 6px; }
.mapdot { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--accent, #e33); border: 2px solid #fff; box-shadow: 0 0 0 1px #0006; }
.mapdot span { display: none; position: absolute; left: 16px; top: -4px; white-space: nowrap; background: #000c; color: #fff; padding: 1px 6px; border-radius: 4px; font-size: 12px; }
.mapdot:hover span, .mapdot:focus span { display: block; }
.tcpics { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin: 8px 0 12px; } .tcpics img { image-rendering: pixelated; max-height: 96px; }
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:8px 0}.formcard{display:flex;gap:10px;align-items:flex-start;padding:8px;border:1px solid var(--line,#8884);border-radius:8px;min-width:0}.formcard img{width:64px;height:64px;object-fit:contain;image-rendering:pixelated;flex:none}.formcard details{margin-top:4px;font-size:13px}
</style>

<header class="bar"><div class="in">
  <a class="home" href="#home">Pokémath Encyclopedia</a>
  <nav aria-label="Lists"><a href="#list-walkthrough">Walkthrough</a><a href="#list-places">Places</a><a href="#list-pokemon">Pokémon</a><a href="#list-moves">Moves</a><a href="#list-items">Items</a><a href="#list-trainers">Trainers</a><a href="#journal">Journal</a><a href="#list-buildings">Buildings</a><a href="#list-mechanics">Mechanics</a></nav>
  <div class="search"><input id="q" type="search" placeholder="Search a place, Pokémon, item…" aria-label="Search" autocomplete="off"><div class="hits" id="hits" hidden></div></div>
</div></header>
<main class="wrap" id="app"><p class="loading">Loading…</p></main>

<script>
const SITE = /*REGIONS*/;
const D = { regions: {}, sp: null };
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const slug = s => String(s).toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const ic = (id, cls = "") => `<i class="ic p${id} ${cls}" aria-hidden="true"></i>`;
const STAT = ["HP", "Attack", "Defense", "Sp. Atk", "Sp. Def", "Speed"];

async function load() {
  const [sp, mech, jour, ...regs] = await Promise.all([fetch("data/species.json").then(r => r.json()), fetch("data/mechanics.json").then(r => r.json()), fetch("data/journal.json").then(r => r.json()),
    ...SITE.live.map(r => fetch(`data/${r.key}.json`).then(x => x.json()))]);
  D.sp = sp; D.mech = mech; D.jour = jour; regs.forEach(r => D.regions[r.key] = r);
  route();
}

function placeOf(key) { for (const r of Object.values(D.regions)) if (r.places[key]) return [r, r.places[key]]; return [null, null]; }
function placeLink(key) { const [, p] = placeOf(key); return p ? `<a href="#place-${slug(key)}">${esc(p.name)}</a>` : esc(key); }
function findPlace(s) { for (const r of Object.values(D.regions)) for (const k in r.places) if (slug(k) === s) return [r, k]; return [null, null]; }
function monName(id) { return D.sp.species[id]?.n ?? `#${id}`; }
function monLink(id) { return `<a class="x" href="#pokemon-${id}">${esc(monName(id))}</a>`; }
function frame(cap, head, rows, cls = "") {
  return `<div class="frame ${cls}"><table><caption>${cap}</caption><thead><tr>${head.map(h => `<th>${h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}
function setTitle(t) { document.title = t ? `${t} · Pokémath Encyclopedia` : "Pokémath Encyclopedia"; }

// ---------------------------------------------------------------- views
function home() {
  setTitle("");
  const live = SITE.live.map(r => `<div class="card"><h3>${esc(r.title)}</h3><p>${esc(r.src)}. ${r.parts} parts, ${r.places} places.</p>
    <div class="chips"><a href="#part-${r.key}-1">Start the walkthrough</a><a href="#places-${slug(r.title.split(" + ")[0])}">Its places</a><a href="#dex-${r.key}">Its Pokédex</a></div></div>`).join("");
  const later = SITE.later.map(n => `<div class="card later"><h3>${esc(n)}</h3><p>Not written yet.</p></div>`).join("");
  const walks = walksHTML();
  return `<div class="crumb">Kanto Math Game</div><h1>Pokémath Encyclopedia</h1>
    <p class="lede">The game's own guide, written from its data: the story in order, and a page for every place, Pokémon, item and important trainer. Names in the tables and text link to their pages. An <span class="ours">ours</span> tag marks something none of that region's source games have.</p>
    <div class="cards">${live}${later}</div>${walks}`;
}

function walksHTML() {
  return Object.values(D.regions).map(reg => `<details class="walk" open><summary><h2>${esc(reg.title)} walkthrough</h2></summary><ol class="parts">${reg.parts.map(p => `<li><a href="#part-${reg.key}-${p.n}">Part ${p.n}</a>: ${esc(p.title)}</li>`).join("")}</ol></details>`).join("");
}

function partView(regKey, n) {
  const r = D.regions[regKey]; const p = r?.parts.find(x => x.n === n);
  if (!p) return notFound();
  setTitle(`Part ${n}`);
  const prev = r.parts.find(x => x.n === n - 1), next = r.parts.find(x => x.n === n + 1);
  return `<div class="crumb"><a href="#home">${esc(r.title)}</a> · Walkthrough · Part ${n}</div><h1 class="ph">${esc(p.title)}</h1>${p.toc}${p.html}
    <div class="pager">${prev ? `<a href="#part-${regKey}-${prev.n}">← Part ${prev.n}: ${esc(prev.title)}</a>` : "<span></span>"}${next ? `<a href="#part-${regKey}-${next.n}">Part ${next.n}: ${esc(next.title)} →</a>` : ""}</div>`;
}

function placeView(s) {
  const [r, k] = findPlace(s); if (!r) return notFound();
  const p = r.places[k];
  setTitle(p.name);
  const part = p.part ? `<a href="#part-${r.key}-${p.part}">Part ${p.part}: ${esc(r.parts.find(x => x.n === p.part).title)}</a>` : "Not covered by a part yet.";
  const go = e => `<a href="#place-${slug(e)}">${esc(r.places[e]?.name ?? e)}</a>`;
  const c = p.conn || { N: [], S: [], W: [], E: [], other: [] };
  const side = (d, arrow) => c[d].length ? `<div class="c-${d}">${d === "N" ? `<span class="arr">${arrow}</span>` : ""}${d === "W" ? `<span class="arr">${arrow}</span>` : ""}${c[d].map(go).join("")}${d === "S" ? `<span class="arr">${arrow}</span>` : ""}${d === "E" ? `<span class="arr">${arrow}</span>` : ""}</div>` : `<div class="c-${d}"></div>`;
  const compass = !["N", "S", "W", "E"].some(d => c[d].length) ? "" : `<div class="compass">${side("N", "↑")}${side("W", "←")}<div class="c-here">${esc(p.name)}</div>${side("E", "→")}${side("S", "↓")}</div>`;
  const other = c.other.length ? `<div class="c-other">${c.other.map(([how, e]) => `<span class="small">${esc(how)}:</span> ${go(e)}`).join("<br>")}</div>` : "";
  const maps = p.maps || [];
  const first = maps[0] ? `<a href="#" data-scroll="maps" class="mapthumb"><img data-region="${r.key}" data-map="${maps[0].src}" alt="Map of ${esc(p.name)}${maps[0].label ? ", " + esc(maps[0].label) : ""}" loading="lazy"></a>` : "";
  const box = `<aside class="infobox"><div class="ib-name">${esc(p.name)}</div>${first}
    <div class="ib-h">Connecting locations</div>${compass}${other}
    <div class="ib-h">In the walkthrough</div><div class="ib-row">${part}</div>
    <div class="ib-h">Wild level</div><div class="ib-row">Lv ${Math.max(2, p.level - 2)}–${p.level + 1}</div></aside>`;
  const all = maps.length ? `<h2 id="maps">${maps.length > 1 ? "Maps" : "Map"}</h2>` + maps.map(m => `${m.label ? `<h4>${esc(m.label)}</h4>` : ""}<div class="mapfull"><img data-region="${r.key}" data-map="${m.src}" alt="Map of ${esc(p.name)}${m.label ? ", " + esc(m.label) : ""}" width="${m.w}" height="${m.h}" loading="lazy"></div>`).join("") : "";
  return `<div class="crumb"><a href="#home">${esc(r.title)}</a> · ${esc((allBoxes().find(b => b.keys.includes(k)) || {}).title || r.title)} · Place</div>
    <div class="placegrid">${box}<div class="placemain">${p.html}${(p.buildings || []).length ? `<h2 id="buildings">Buildings</h2><div class="chips">${p.buildings.map(([id, n]) => `<a href="#building-${id}">${esc(n)}</a>`).join("")}</div>` : ""}${all}</div></div>${navbox(allBoxes().find(b => b.keys.includes(k)), k, true)}`;
}

function monView(id) {
  const s = D.sp.species[id]; if (!s) return notFound();
  setTitle(s.n);
  const types = s.t.map(t => `<span class="type">${esc(t)}</span>`).join("");
  const facts = [["Number", `#${String(id).padStart(3, "0")}`], ["Kind", s.k ? `${esc(s.k)} Pokémon` : "—"],
    ["Height", s.h != null ? `${s.h} m` : "—"], ["Weight", s.w != null ? `${s.w} kg` : "—"]]
    .map(([a, b]) => `<div><b>${a}</b>${b}</div>`).join("");
  const top = Math.max(...s.s.filter(Boolean), 1);
  const stats = s.s.some(Boolean) ? `<h3>Base stats</h3><div class="stats">${s.s.map((v, i) => `<span>${STAT[i]}</span><b>${v ?? "—"}</b><span class="bar2" style="width:${Math.round(100 * (v || 0) / Math.max(top, 150))}%"></span>`).join("")}<span>Total</span><b>${s.s.reduce((a, b) => a + (b || 0), 0)}</b><span></span></div>` : "";
  // the whole family, in order
  const fam = new Set([+id]); let grow = true;
  while (grow) { grow = false; for (const [a, b] of D.sp.evo) if ((fam.has(a) || fam.has(b)) && !(fam.has(a) && fam.has(b))) { fam.add(a); fam.add(b); grow = true; } }
  const links = D.sp.evo.filter(([a, b]) => fam.has(a) && fam.has(b));
  let evo = "";
  if (links.length) {
    const roots = [...fam].filter(x => !links.some(([, b]) => b === x));
    const lines = [];
    const walk = (x, path) => { const nx = links.filter(([a]) => a === x); if (!nx.length) lines.push(path); nx.forEach(([, b, w]) => walk(b, [...path, [b, w]])); };
    roots.forEach(r0 => walk(r0, [[r0, ""]]));
    evo = `<h3>Evolution</h3>` + lines.map(l => `<div class="evo">${l.map(([x, w], i) => `${i ? `<span class="arrow">${esc(w)} →</span>` : ""}<span class="step${x === +id ? " me" : ""}">${ic(x)}${x === +id ? esc(monName(x)) : monLink(x)}</span>`).join("")}</div>`).join("");
  }
  let where = "", used = "";
  for (const r of Object.values(D.regions)) {
    const m = r.mons[id]; if (!m) continue;
    if (m.gift && m.gift.length) where += frame(`Starter: ${esc(r.title)}`, ["Place", "How", "Level"], m.gift.map(g =>
      `<tr><td>${g.p ? placeLink(g.p) : "—"}</td><td>${esc(g.how)}</td><td>${esc(g.lv)}</td></tr>`));
    if (m.wild.length) where += frame(`In the wild: ${esc(r.title)}`, ["Place", "How", "Levels", "Rate"], m.wild.map(w =>
      `<tr><td>${placeLink(w.p)}${w.form ? ` <span class="small">(${esc(w.form)})</span>` : ""}${w.after ? ` <span class="when">after ${esc(w.after)}</span>` : ""}${w.ours ? ' <span class="ours">ours</span>' : ""}</td><td><span class="how">${esc(w.how)}</span></td><td>${esc(w.lv)}</td><td class="rate">${w.rate}</td></tr>`));
    if (m.used.length) used += frame(`Trainers who use it: ${esc(r.title)}`, ["Trainer", "Where", "Level"], m.used.map(u =>
      `<tr><td>${esc(u.who)}</td><td>${placeLink(u.p)}</td><td>${u.lv ?? "—"}</td></tr>`));
  }
  if (!where) where = `<p class="small">Not found in the wild in the regions written so far.</p>`;
  return `<div class="crumb"><a href="#list-pokemon">Pokémon</a> · #${String(id).padStart(3, "0")}</div>
    <div class="hero">${ic(id, "big")}<div><h1>${esc(s.n)}</h1><div class="types">${types}</div></div></div>
    <div class="facts">${facts}</div>${evo}${stats}<div id="more-mon" data-id="${id}"></div><h3>Where to find it</h3><div class="grid">${where}</div>${used ? `<h3>Used by</h3><div class="grid">${used}</div>` : ""}`;
}

function itemView(s) {
  let e = null; for (const r of Object.values(D.regions)) if (r.items[s]) { e = { ...r.items[s], all: [] }; break; }
  if (!e) return notFound();
  setTitle(e.name);
  const rows = []; for (const r of Object.values(D.regions)) (r.items[s]?.where || []).forEach(w => rows.push(`<tr><td>${w.p ? placeLink(w.p) : (w.l || "—")}${w.p ? "" : ` <span class="small">(${esc(r.title)})</span>`}</td><td>${esc(w.w)}</td></tr>`));
  return `<div class="crumb"><a href="#list-items">Items</a></div><div class="hero">${e.ic.replace('class="ic ', 'class="ic mid ')}<h1>${esc(e.name)}</h1></div>
    ${e.desc ? `<p>${esc(e.desc)}</p>` : ""}<div class="grid">${frame("Where to get it", ["Place", "How"], rows)}</div>`;
}

function trainerView(s) {
  let t = null; for (const r of Object.values(D.regions)) if (r.trainers[s]) { t = r.trainers[s]; break; }
  if (!t) return notFound();
  setTitle(t.name);
  return `<div class="crumb"><a href="#list-trainers">Trainers</a> · ${esc(t.cls)}</div><h1>${esc(t.name)}</h1>
    ${t.battles.map(b => `<h3>${placeLink(b.p)}</h3>${b.html}`).join("")}`;
}

let MORE = {};
function loadData(name) { return (MORE[name] ||= fetch(`data/${name}.json`).then(x => x.json())); }
function moveKey(s) { return Object.keys(D.sp.mv).find(k => slug(k) === s); }
function moveLink(k) { const m = D.sp.mv[k]; return `<a class="x" href="#move-${slug(k)}">${esc(m ? m[0] : k)}</a>`; }
function itemLinkIf(key, name) { const k = slug(key); return Object.values(D.regions).some(r => r.items[k]) ? `<a href="#item-${k}">${esc(name)}</a>` : esc(name); }

function fillMore() {
  const mon = document.getElementById("more-mon");
  if (mon) loadData("pokedex").then(pd => {
    const e = pd[mon.dataset.id]; if (!e) return;
    const facts = [];
    if (e.ab) facts.push(["Ability", esc(e.ab.join(" or "))]);
    if (e.hab) facts.push(["Hidden Ability", esc(e.hab)]);
    if (e.eg) facts.push(["Egg groups", esc(e.eg.join(", "))]);
    if (e.gr) facts.push(["Growth", esc(e.gr)]);
    if (e.ev) facts.push(["EV yield", esc(e.ev)]);
    let h = facts.length ? `<div class="facts">${facts.map(([a, b]) => `<div><b>${a}</b>${b}</div>`).join("")}</div>` : "";
    if (e.mega) h += `<h3>Mega Evolution</h3>` + e.mega.map(m => `<p><b>${esc(m.n)}</b> (${m.t.map(t => `<span class="type">${esc(t)}</span>`).join("")}) with the ${itemLinkIf(m.ik.replace(/-/g, "_"), m.item)}. Base stats: ${m.s.map((v, i) => `${STAT[i]} ${v}`).join(", ")}. See <a href="#mechanic-mega-evolution">Mega Evolution</a>.</p>`).join("");
    if (e.forms) {
      const reg = e.forms.filter(f => f.k !== "Other form"), oth = e.forms.filter(f => f.k === "Other form");
      const card = f => `<div class="formcard">${f.pic ? `<img src="${f.pic}" alt="${esc(f.n)}" loading="lazy">` : ""}<div><b>${esc(f.n)}</b> <span class="small">${esc(f.k)}</span><div class="types">${f.t.map(t => `<span class="type">${esc(t)}</span>`).join("")}</div>`
        + `<div class="small">${f.s ? `Base stats: ${f.s.map((v, i) => `${STAT[i]} ${v}`).join(", ")}` : `Base stats: the same as ${esc(D.sp.species[mon.dataset.id].n)}'s`}`
        + `${f.ab ? `<br>Ability: ${esc(f.ab.join(" or "))}${f.hab ? ` (hidden: ${esc(f.hab)})` : ""}` : ""}</div>`
        + `${f.ls ? `<details><summary>Moves it learns by level</summary>${f.ls.map(([lv, k]) => `${lv <= 1 ? "Start" : "Lv. " + lv} ${moveLink(k)}`).join(" · ")}</details>` : ""}</div></div>`;
      if (reg.length) h += `<h3 id="regional-forms">Regional forms</h3><div class="forms">${reg.map(card).join("")}</div>`;
      if (oth.length) h += `<h3>Other forms</h3><div class="forms">${oth.map(card).join("")}</div>`;
      if (reg.length || oth.length) h += `<p class="small">Where a form lives in the wild is in "Where to find it" below, marked with the form's name.</p>`;
    }
    if (e.ls) h += frame("Moves it learns by level", ["Level", "Move", "Type", "Category"], e.ls.map(([lv, k]) => `<tr><td>${lv <= 1 ? "Start" : lv}</td><td>${moveLink(k)}</td><td>${D.sp.mv[k] ? esc(D.sp.mv[k][1]) : ""}</td><td>${D.sp.mv[k] ? esc(D.sp.mv[k][2]) : ""}</td></tr>`));
    if (e.tm) h += `<h3>TMs it can learn</h3><div class="chips">${e.tm.map(tm => { const mv = (D.sp.tms[tm] || [tm])[0]; return `<a href="#move-${slug(mv)}">${esc(tm)} ${esc(D.sp.mv[mv] ? D.sp.mv[mv][0] : mv)}</a>`; }).join("")}</div>`;
    mon.innerHTML = h;
  });
  const mv = document.getElementById("more-move");
  if (mv) loadData("movedex").then(md => {
    const m = md[mv.dataset.key]; if (!m) return;
    const facts = [["Type", esc(m.t)], ["Category", esc(m.c)], ["Power", m.p ?? "—"], ["Accuracy", m.a != null ? m.a + "%" : "—"], ["PP", m.pp ?? "—"]];
    if (m.pr) facts.push(["Priority", (m.pr > 0 ? "+" : "") + m.pr]);
    if (m.tm) facts.push(["TM", itemLinkIf(m.tm, m.tm)]);
    let h = `<div class="facts">${facts.map(([a, b]) => `<div><b>${a}</b>${b}</div>`).join("")}</div>`;
    if (m.e) h += `<p>${esc(m.e)}</p>`;
    if (m.lv.length) h += frame(`Pokémon that learn it by level (${m.lv.length})`, ["Pokémon", "Level"], m.lv.map(([pid, lv]) => `<tr><td>${ic(pid)}${monLink(pid)}</td><td>${lv <= 1 ? "Start" : lv}</td></tr>`));
    if (m.tml.length) h += `<h3>Pokémon that learn it from ${esc(m.tm || "its TM")} (${m.tml.length})</h3><ul class="grid3">${m.tml.map(pid => `<li><a href="#pokemon-${pid}">${ic(pid)}${esc(monName(pid))}</a></li>`).join("")}</ul>`;
    mv.innerHTML = h;
  });
  const map = document.getElementById("region-map");
  if (map) loadData("regionmaps").then(rm => {
    const r = rm[map.dataset.r]; if (!r) { map.innerHTML = "<p>No town map for this region.</p>"; return; }
    const dots = Object.entries(r.pts).map(([s, [x, y, n]]) => `<a class="mapdot" href="#place-${s}" style="left:${(100 * x / r.w).toFixed(2)}%;top:${(100 * y / r.h).toFixed(2)}%" title="${esc(n)}"><span>${esc(n)}</span></a>`).join("");
    map.innerHTML = `<div class="regionmap"><img src="${r.img}" alt="Town map of ${esc(map.dataset.title)}" width="${r.w}" height="${r.h}">${dots}</div>
      <h3>Places on the map</h3><div class="chips">${Object.entries(r.pts).map(([s, [, , n]]) => `<a href="#place-${s}">${esc(n)}</a>`).join("")}</div>`;
  });
}

function moveView(s) {
  const k = moveKey(s); if (!k) return notFound();
  const [n, t] = D.sp.mv[k];
  setTitle(n);
  return `<div class="crumb"><a href="#list-moves">Moves</a> · ${esc(t)}</div><h1>${esc(n)}</h1><div id="more-move" data-key="${esc(k)}"><p class="loading">Loading…</p></div>`;
}

function dexView(key) {
  const r = D.regions[key]; if (!r || !r.dex || !r.dex.length) return notFound();
  setTitle(`${r.title} Pokédex`);
  const rows = r.dex.map((id, i) => {
    const m = r.mons[id];
    const places = m ? [...new Set(m.wild.map(w => w.p))] : [];
    const where = places.length ? places.slice(0, 4).map(placeLink).join(", ") + (places.length > 4 ? ` and ${places.length - 4} more` : "") : `<span class="small">not in the wild here</span>`;
    return `<tr><td>${String(i + 1).padStart(3, "0")}</td><td>${ic(id)}${monLink(id)}</td><td>${where}</td></tr>`;
  });
  return `<div class="crumb"><a href="#list-pokemon">Pokémon</a> · Pokédex</div><h1>${esc(r.title)} Pokédex</h1>
    <p class="lede">The ${rows.length} Pokémon of ${esc(r.title)}'s own Pokédex, in its order, with where to catch each one there. Pokémon "not in the wild here" come by evolving, from people, or from a story event: their pages say how.</p>` +
    frame(`${r.title} Pokédex`, ["No.", "Pokémon", "Where to catch it here"], rows);
}

function mapView(rk) {
  const R = rk.toUpperCase();
  if (!(D.sp.maps || []).includes(R)) return notFound();
  const title = R === "SEVII" ? "Sevii Islands" : R === "ORANGE" ? "Orange Islands" : R.charAt(0) + R.slice(1).toLowerCase();
  setTitle(`${title} town map`);
  return `<div class="crumb"><a href="#list-places">Places</a> · Town map</div><h1>${esc(title)} town map</h1>
    <p class="lede">The game's own town map, as its Fly screen shows it. Tap a marked place to open its page.</p><div id="region-map" data-r="${R}" data-title="${esc(title)}"><p class="loading">Loading…</p></div>`;
}

function buildingView(id) {
  for (const r of Object.values(D.regions)) {
    const b = (r.buildings || {})[id]; if (!b) continue;
    setTitle(b.name);
    const place = r.places[b.p];

      ${others.length ? `<h2>Other buildings in ${esc(place.name)}</h2><div class="chips">${others.map(([x, n]) => `<a href="#building-${x}">${esc(n)}</a>`).join("")}</div>` : ""}`;
  }
  return notFound();
}

function listView(kind) {
  if (kind === "walkthrough") {

    return `<div class="crumb">Lists</div><h1>Walkthrough</h1><p class="lede">The story of each region, part by part, in the order you play it.</p>` + walksHTML();
  }
  if (kind === "places") {

      ((D.sp.maps || []).length ? `<p><b>Town maps:</b> ${D.sp.maps.map(R => `<a href="#map-${R.toLowerCase()}">${esc(R === "SEVII" ? "Sevii Islands" : R === "ORANGE" ? "Orange Islands" : R.charAt(0) + R.slice(1).toLowerCase())}</a>`).join(" · ")}</p>` : "") +

    return `<div class="crumb">Lists</div><h1>Pokémon</h1><p class="lede">${ids.length} Pokémon you can meet in the regions written so far. Every other Pokémon has a page too: search for it.</p>
      <p><b>Each region's own Pokédex:</b> ${Object.values(D.regions).filter(r => (r.dex || []).length).map(r => `<a href="#dex-${r.key}">${esc(r.title)}</a>`).join(" · ")} · <a href="#list-tms">TM list</a></p>
      <ul class="grid3">${ids.map(i => `<li><a href="#pokemon-${i}"><span class="no">#${String(i).padStart(3, "0")}</span>${ic(i)}${esc(monName(i))}</a></li>`).join("")}</ul>`;
  }
  if (kind === "moves") {
    setTitle("Moves");
    const by = {}; Object.entries(D.sp.mv).forEach(([k, [n, t]]) => (by[t || "Other"] ||= []).push([k, n]));
    return `<div class="crumb">Lists</div><h1>Moves</h1><p class="lede">Every move the game knows, by type. Each page says what the move does and which Pokémon learn it, by level or by TM. See also the <a href="#list-tms">TM list</a>.</p>` +
      Object.keys(by).sort().map(t => `<h3>${esc(t)}</h3><div class="chips">${by[t].sort((a, b) => a[1].localeCompare(b[1])).map(([k, n]) => `<a href="#move-${slug(k)}">${esc(n)}</a>`).join("")}</div>`).join("");
  }
  if (kind === "tms") {
    setTitle("TMs");
    const rows = Object.entries(D.sp.tms).sort().map(([tm, [mv, price, tier]]) => {
      const where = Object.values(D.regions).filter(r => r.items[slug(tm)]).map(r => `<a href="#item-${slug(tm)}">${esc(r.title)}</a>`);
      const n = D.sp.mv[mv] ? D.sp.mv[mv][0] : mv;
      return `<tr><td>${esc(tm)}</td><td><a href="#move-${slug(mv)}">${esc(n)}</a></td><td>${D.sp.mv[mv] ? esc(D.sp.mv[mv][1]) : ""}</td><td>${tier ? `${tier} badge${tier > 1 ? "s" : ""}` : "From the start"}${price ? ` · $${price.toLocaleString()}` : ""}</td><td>${where.join(", ") || "—"}</td></tr>`;
    });
    return `<div class="crumb">Lists</div><h1>TMs</h1><p class="lede">All ${rows.length} TMs, in this game's own numbering. A TM teaches its move for good: once you have it, every Pokémon that can learn it can use it. Every region's Poké Mart but the Orange Islands' sells each TM once you hold that many of the region's badges; "Found in" lists the regions where one also lies on the ground or is handed to you (the TM's page says where). See <a href="#mechanic-tms-and-tutors">TMs and tutors</a>.</p>` +
      frame("Every TM", ["TM", "Move", "Type", "Poké Mart", "Found in"], rows);
  }
  if (kind === "items") {

    const all = {}; Object.values(D.regions).forEach(r => Object.entries(r.items).forEach(([k, e]) => all[k] ||= e));
    const ks = Object.keys(all).sort((a, b) => all[a].name.localeCompare(all[b].name));
    return `<div class="crumb">Lists</div><h1>Items</h1><p class="lede">Every item lying on the ground, hidden, handed to you, sold at the Poké Mart counter, or swapped at a Game Corner or Battle Points counter.</p>

  }
  if (kind === "buildings") {
    setTitle("Buildings");
    return `<div class="crumb">Lists</div><h1>Buildings</h1><p class="lede">Every building in the places written so far, town by town: each floor's map, the people in it and what they do, its items and its trainers. Tap a region's name to fold it away.</p>` +
      Object.values(D.regions).map(r => {
        const by = {}; Object.entries(r.buildings || {}).forEach(([id, b]) => b.html && (by[b.p] ||= []).push([id, b]));
        const rows = r.order.filter(k => by[k]).map(k => `<div class="nb-h"><a href="#place-${slug(k)}">${esc(r.places[k].name)}</a></div><div class="nb-row">${by[k].map(([id, b]) => `<a href="#building-${id}">${esc(b.name)}</a>`).join(" · ")}</div>`).join("");

    return `<div class="crumb">Lists</div><h1>Mechanics</h1><p class="lede">How the game's systems work: the ones every region shares, with what changes from region to region, and each region's own.</p>` +

      <div class="chips">${Object.entries(D.mech).filter(([, m]) => m.group === "Trainer classes").map(([k, m]) => `<a href="#mechanic-${k}">${esc(m.title)}</a>`).join("")}</div>` +
      Object.values(D.regions).map(r => {
        const groups = {}; Object.entries(r.trainers).forEach(([k, t]) => (groups[t.cls] ||= []).push([k, t]));
        return `<h2>${esc(r.title)}</h2>` + Object.entries(groups).map(([c, ts]) => `<h4>${esc(c)}</h4><div class="chips">${ts.map(([k, t]) => `<a href="#trainer-${k}">${esc(t.name)}</a>`).join("")}</div>`).join("");
      }).join("");
  }
  return notFound();
}

// a region's map pictures load the first time one of its place pages opens (a few MB), then stay
let MAPS = null;
function fillMaps() {
  const imgs = app.querySelectorAll("img[data-map]"); if (!imgs.length) return;
  MAPS ||= {};
  imgs.forEach(i => {
    const reg = i.dataset.region;
    MAPS[reg] ||= fetch(`data/${reg}-maps.json`).then(x => x.json());
    MAPS[reg].then(m => { if (m[i.dataset.map]) i.src = m[i.dataset.map]; });
  });
}

// ---------------------------------------------------------------- the region boxes (Settlements, Routes, Landmarks)
function allBoxes() { return Object.values(D.regions).flatMap(r => r.nav || []); }
function navbox(b, here, open) {
  if (!b) return "";
  const link = ([text, k]) => k === here ? `<b>${esc(text)}</b>` : `<a href="#place-${slug(k)}">${esc(text)}</a>`;
  const groups = b.groups.map(([label, items]) => `<div class="nb-h">${esc(label)}</div><div class="nb-row">${items.map(link).join(" · ")}</div>`).join("");
  const have = new Set(allBoxes().map(x => x.title));
  const access = b.access.length ? `<div class="nb-h">Access to</div><div class="nb-row">${b.access.map(t => have.has(t) ? `<a href="#places-${slug(t)}">${esc(t)}</a>` : `<span class="small">${esc(t)} (not written yet)</span>`).join(" · ")}</div>` : "";
  return `<details class="navbox" id="nav-${b.slug}"${open ? " open" : ""}><summary><span class="nb-title">${esc(b.title)}</span>${b.badges.length ? `<span class="nb-badges">${b.badges.join("")}</span>` : ""}</summary><div class="nb-body">${groups}${access}</div></details>`;
}

function notFound() { setTitle("Not found"); return `<h1>Page not found</h1><p>That page isn't in the encyclopedia. <a href="#home">Back to the start</a>.</p>`; }

function route() {
  const h = decodeURIComponent(location.hash.slice(1)) || "home";
  let m, html;
  if (h === "home") html = home();
  else if ((m = h.match(/^part-([a-z]+)-(\d+)$/))) html = partView(m[1], +m[2]);
  else if ((m = h.match(/^part-(\d+)$/))) html = partView("kanto", +m[1]);
  else if ((m = h.match(/^place-(.+)$/))) html = placeView(m[1]);
  else if ((m = h.match(/^places-(.+)$/))) { html = listView("places"); app.innerHTML = html; window.scrollTo(0, 0); const el = document.getElementById("nav-" + m[1]); if (el) { el.open = true; el.scrollIntoView(); } return; }
  else if ((m = h.match(/^pokemon-(\d+)$/))) html = monView(+m[1]);
  else if ((m = h.match(/^item-(.+)$/))) html = itemView(m[1]);
  else if ((m = h.match(/^trainer-(.+)$/))) html = trainerView(m[1]);
  else if ((m = h.match(/^building-(.+)$/))) html = buildingView(m[1]);
  else if ((m = h.match(/^move-(.+)$/))) html = moveView(m[1]);
  else if ((m = h.match(/^dex-([a-z]+)$/))) html = dexView(m[1]);
  else if ((m = h.match(/^map-([a-z]+)$/))) html = mapView(m[1]);
  else if ((m = h.match(/^mechanic-(.+)$/))) html = mechanicView(m[1]);
  else if (h === "journal") html = journalHub();
  else if ((m = h.match(/^journal-([a-z]+)$/))) html = journalView(m[1]);
  else if ((m = h.match(/^list-(\w+)$/))) html = listView(m[1]);
  else { const el = document.getElementById(h); if (el) { el.scrollIntoView(); return; } html = notFound(); }
  app.innerHTML = html;
  window.scrollTo(0, 0);
  fillMaps();
  fillMore();
}

// a part's contents box scrolls within the part
app.addEventListener("click", e => {
  const a = e.target.closest("a[data-scroll]"); if (!a) return;
  const el = document.getElementById(a.dataset.scroll); if (!el) return;
  e.preventDefault(); el.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});

// ---------------------------------------------------------------- search
const q = document.getElementById("q"), hits = document.getElementById("hits");
function searchIndex() {
  const out = [];
  for (const [id, s] of Object.entries(D.sp.species)) out.push([s.n, `#pokemon-${id}`, "Pokémon", ic(id)]);
  for (const r of Object.values(D.regions)) {
    for (const [k, p] of Object.entries(r.places)) out.push([p.name, `#place-${slug(k)}`, "Place", ""]);
    for (const [k, e] of Object.entries(r.items)) out.push([e.name, `#item-${k}`, "Item", e.ic]);
    for (const [k, t] of Object.entries(r.trainers)) out.push([t.name, `#trainer-${k}`, "Trainer", ""]);
    for (const [k, b] of Object.entries(r.buildings || {})) if (b.html) out.push([`${b.name} (${r.places[b.p].name})`, `#building-${k}`, "Building", ""]);
    for (const p of r.parts) out.push([`Part ${p.n}: ${p.title}`, `#part-${r.key}-${p.n}`, "Walkthrough", ""]);
  }
  for (const [k, m] of Object.entries(D.mech)) out.push([m.title, `#mechanic-${k}`, "Mechanic", ""]);
  for (const [k, j] of Object.entries(D.jour)) out.push([j.title, `#journal-${k}`, "Journal", ""]);
  for (const [k, [n]] of Object.entries(D.sp.mv)) out.push([n, `#move-${slug(k)}`, "Move", ""]);
  return out;
}
let IDX = null, sel = -1;
q.addEventListener("input", () => {
  IDX ||= searchIndex();

  if (t.length < 2) { hits.hidden = true; return; }
  const found = IDX.filter(x => x[0].toLowerCase().includes(t)).sort((a, b) => a[0].toLowerCase().indexOf(t) - b[0].toLowerCase().indexOf(t)).slice(0, 14);
  hits.innerHTML = found.length ? found.map(x => `<a href="${x[1]}">${x[3]}${esc(x[0])}<span class="kind">${x[2]}</span></a>`).join("") : `<a>No matches</a>`;
  hits.hidden = false;
});
q.addEventListener("keydown", e => {
  const as = [...hits.querySelectorAll("a[href]")]; if (hits.hidden || !as.length) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); sel = (sel + (e.key === "ArrowDown" ? 1 : -1) + as.length) % as.length; as.forEach((a, i) => a.classList.toggle("on", i === sel)); }
  if (e.key === "Enter") { e.preventDefault(); location.hash = as[Math.max(sel, 0)].getAttribute("href"); }
});
hits.addEventListener("click", () => { hits.hidden = true; q.value = ""; });
document.addEventListener("click", e => { if (!e.target.closest(".search")) hits.hidden = true; });
window.addEventListener("hashchange", () => { hits.hidden = true; q.value = ""; route(); });
